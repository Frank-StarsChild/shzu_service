<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>石大智多星 · 校园一站式服务智能体</title>
    <meta name="description" content="基于 TeleAgent 的校园一站式服务智能体：官方资料问答、办事向导与文书导出" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23E4002B'/%3E%3Crect x='8' y='8' width='20' height='20' fill='%23fff'/%3E%3Ctext x='34' y='24' font-family='Helvetica,Arial' font-size='14' fill='%23fff' font-weight='700'%3ESHZU%3C/text%3E%3Ctext x='8' y='52' font-family='Helvetica,Arial' font-size='11' fill='%23fff' font-weight='700'%3E%E6%99%BA%E5%A4%9A%E6%98%9F%3C/text%3E%3C/svg%3E" />
    <script>
      // 主题预置：在应用挂载前恢复 data-theme，防止夜间深色页面刷新时先闪白。
      // 逻辑与 src/stores/theme.ts 同源（shzu.theme / 跟随系统 / 存储不可用回退）；
      // store 的 init() 会重新求值并幂等地再写一次。
      (function () {
        var mode = "system";
        try {
          var raw = localStorage.getItem("shzu.theme");
          if (raw === "light" || raw === "dark" || raw === "system") mode = raw;
        } catch (e) {}
        var dark = mode === "dark";
        if (!dark && mode === "system" && window.matchMedia) {
          dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        }
        var theme = dark ? "dark" : "light";
        var root = document.documentElement;
        root.setAttribute("data-theme", theme);
        root.style.colorScheme = theme;
        root.style.background = dark ? "#0c1420" : "#f6f3ea";
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
